name: Desplegar Backend a AWS EKS

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: "us-east-1"
  EKS_CLUSTER_NAME: "sanos-salvos-cluster"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Iniciar sesion en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Compilar Backend (Maven)
      run: mvn clean package -DskipTests

    - name: Construir y subir imagen de MS Mascotas a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: sanos-salvos-ms-mascotas
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f ms-mascotas/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

    - name: Construir y subir imagen de MS Geo a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: sanos-salvos-ms-geo
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f ms-geo/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

    - name: Construir y subir imagen de MS Coincidencias a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: sanos-salvos-ms-coincidencias
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f ms-coincidencias/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

    - name: Construir y subir imagen de API Gateway a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: sanos-salvos-api-gateway
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f api-gateway/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

    - name: Construir y subir imagen de BFF a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: sanos-salvos-bff
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f bff-sanosysalvos/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

    - name: Actualizar configuracion de kubeconfig
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Desplegar en EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        if [ -d "k8s" ]; then
          cd k8s
          for f in *.yaml; do
            sed -i "s|ECR_REGISTRY_PLACEHOLDER|$ECR_REGISTRY|g" $f
            sed -i "s|IMAGE_TAG_PLACEHOLDER|$IMAGE_TAG|g" $f
            kubectl apply -f $f
          done
        else
          echo "La carpeta k8s no se encontró en este repositorio."
        fi
