version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ms_mascotas_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sanos_salvos_mascotas_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_mascotas_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms_mascotas_app
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DB=sanos_salvos_mascotas_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_mascotas_data:
