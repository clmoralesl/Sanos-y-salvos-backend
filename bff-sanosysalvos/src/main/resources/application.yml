server:
  port: 8084

spring:
  application:
    name: bff-sanosysalvos

clients:
  ms-mascotas:
    url: ${MS_MASCOTAS_URL:http://localhost:8081}
  ms-geo:
    url: ${MS_GEO_URL:http://localhost:8082}
  ms-coincidencias:
    url: ${MS_COINCIDENCIAS_URL:http://localhost:8083}

logging:
  level:
    com.sanosysalvos.bff: DEBUG
    org.springframework.web: INFO

resilience4j:
  circuitbreaker:
    instances:
      bffMascotasCB:
        registerHealthIndicator: true
        slidingWindowSize: 5
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 5000ms
        failureRateThreshold: 50
      bffGeoCB:
        registerHealthIndicator: true
        slidingWindowSize: 5
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 5000ms
        failureRateThreshold: 50
      bffCoincidenciasCB:
        registerHealthIndicator: true
        slidingWindowSize: 5
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 5000ms
        failureRateThreshold: 50
