version: '3.8'

services:
  # ==========================================
  # MS-MASCOTAS DB & APP
  # ==========================================
  mysql-mascotas:
    image: mysql:8.0
    container_name: mysql-mascotas
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sanos_salvos_mascotas_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_mascotas_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      timeout: 10s
      retries: 10
    networks:
      - sanosysalvos-network

  ms-mascotas:
    build:
      context: ./ms-mascotas
      dockerfile: Dockerfile
    container_name: ms-mascotas
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - MYSQL_HOST=mysql-mascotas
      - MYSQL_PORT=3306
      - MYSQL_DB=sanos_salvos_mascotas_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
    depends_on:
      mysql-mascotas:
        condition: service_healthy
    networks:
      - sanosysalvos-network

  # ==========================================
  # MS-GEO DB & APP
  # ==========================================
  mysql-geo:
    image: mysql:8.0
    container_name: mysql-geo
    restart: always
    environment:
      MYSQL_DATABASE: sanos_salvos_geo_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_geo_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sanosysalvos-network

  ms-geo:
    build:
      context: ./ms-geo
      dockerfile: Dockerfile
    container_name: ms-geo
    restart: always
    ports:
      - "8082:8082"
    environment:
      - MYSQL_HOST=mysql-geo
      - MYSQL_PORT=3306
      - MYSQL_DB=sanos_salvos_geo_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
    depends_on:
      mysql-geo:
        condition: service_healthy
    networks:
      - sanosysalvos-network

  # ==========================================
  # MS-COINCIDENCIAS DB & APP
  # ==========================================
  mysql-coincidencias:
    image: mysql:8.0
    container_name: mysql-coincidencias
    environment:
      MYSQL_DATABASE: sanos_salvos_coincidencias_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - mysql_coincidencias_data:/var/lib/mysql
    networks:
      - sanosysalvos-network

  ms-coincidencias:
    build:
      context: ./ms-coincidencias
      dockerfile: Dockerfile
    container_name: ms-coincidencias
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=mysql-coincidencias
      - DB_PORT=3306 
      - DB_USER=root
      - DB_PASSWORD=root
      - MS_MASCOTAS_URL=http://ms-mascotas:8081
      - MS_GEO_URL=http://ms-geo:8082
    depends_on:
      mysql-coincidencias:
        condition: service_healthy
      ms-mascotas:
        condition: service_started
      ms-geo:
        condition: service_started
    restart: unless-stopped
    networks:
      - sanosysalvos-network

  # ==========================================
  # API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - MS_MASCOTAS_URL=http://ms-mascotas:8081
      - MS_GEO_URL=http://ms-geo:8082
      - MS_COINCIDENCIAS_URL=http://ms-coincidencias:8083
    depends_on:
      - ms-mascotas
      - ms-geo
      - ms-coincidencias
    networks:
      - sanosysalvos-network

volumes:
  mysql_mascotas_data:
  mysql_geo_data:
  mysql_coincidencias_data:

networks:
  sanosysalvos-network:
    driver: bridge
