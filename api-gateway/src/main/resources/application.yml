server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-sanosysalvos.us.auth0.com/}
  cloud:
    gateway:
      routes:
        # Microservicio de Mascotas
        - id: ms-mascotas
          uri: ${MS_MASCOTAS_URL:http://localhost:8081}
          predicates:
            - Path=/mascotas/**
            
        # Microservicio de Geolocalización
        - id: ms-geo
          uri: ${MS_GEO_URL:http://localhost:8082}
          predicates:
            - Path=/geo/**
                
        # Microservicio de Coincidencias
        - id: ms-coincidencias
          uri: ${MS_COINCIDENCIAS_URL:http://localhost:8083}
          predicates:
            - Path=/coincidencias/**

        # BFF (Backend For Frontend)
        - id: bff-sanosysalvos
          uri: ${BFF_URL:http://localhost:8084}
          predicates:
            - Path=/bff/**

# Configuración de Logging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG
