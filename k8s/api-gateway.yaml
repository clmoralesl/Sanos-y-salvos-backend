apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ECR_REGISTRY_PLACEHOLDER/sanos-salvos-api-gateway:IMAGE_TAG_PLACEHOLDER
        env:
        - name: MS_MASCOTAS_URL
          value: http://ms-mascotas:8081
        - name: MS_GEO_URL
          value: http://ms-geo:8082
        - name: MS_COINCIDENCIAS_URL
          value: http://ms-coincidencias:8083
        - name: BFF_URL
          value: http://bff-sanosysalvos:8084
        - name: AUTH0_ISSUER_URI
          value: "https://dev-auth0.com/" # Requiere ajuste con secrets reales en k8s
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
